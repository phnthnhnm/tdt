name: tdt
description: "Torrent Diff Tool: compare two .torrent files and hand the new files to qBittorrent."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  file_picker: ^13.3.3
  dtorrent_parser: ^1.0.9
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  http: ^1.6.0
  logging: ^1.3.0
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
