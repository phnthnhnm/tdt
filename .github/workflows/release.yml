name: Release Build and Upload

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and Upload Windows
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: Publish self-contained build
        run: >
          dotnet publish src/Tdt.App/Tdt.App.csproj -c Release -r win-x64
          --self-contained -p:WindowsAppSDKSelfContained=true
          -o artifacts/publish

      - name: Extract version and zip
        id: zip
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          ZIP_NAME="tdt-${VERSION}-windows-x64.zip"
          cd artifacts/publish
          7z a -tzip -mx=9 "../${ZIP_NAME}" *
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Upload to release
        shell: bash
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "artifacts/${{ steps.zip.outputs.ZIP_NAME }}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
